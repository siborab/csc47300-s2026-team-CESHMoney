<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Sign In</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="index.html">SpendWise</a></h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="index.html#features">Features</a></li>
          <li><a href="index.html#about">About</a></li>
          <li class="login-menu">
            <details>
              <summary>Login</summary>
              <ul class="login-dropdown">
                <li><a href="signin.html">Sign In</a></li>
                <li><a href="signup.html">Sign Up</a></li>
              </ul>
            </details>
          </li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Sign in to continue managing shared expenses.</p>

      <form id="signinForm" class="auth-form" novalidate>
        <div>
          <label for="signinEmail">Email</label>
          <input id="signinEmail" name="signinEmail" type="email" required>
        </div>

        <div>
          <label for="signinPassword">Password</label>
          <input id="signinPassword" name="signinPassword" type="password" required>
        </div>

        <button type="submit" class="auth-submit">Sign In</button>
        <p id="authMessage" class="auth-message" aria-live="polite"></p>
      </form>

      <p class="auth-links">Need an account? <a href="signup.html">Create one here</a>.</p>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 SpendWise. All rights reserved.</p>
    </div>
  </footer>

  <script src="./auth.js"></script>
</body>
</html>
